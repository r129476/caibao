<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e77538"><meta name="description" content="告诉菜包你有什么食材，找到材料齐全的家常菜。">
  <title>菜包 · 有什么，就做什么</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="hero-inner"><a class="brand" href="./">菜包<span>你的冰箱小帮手</span></a><span class="edition">家常饭，也值得好好吃</span><h1>冰箱里有这些，<br>今天就吃点好的。</h1><p>选好已有食材，看看现在能做什么。</p></div></header>
<main class="layout">
<aside class="controls">
  <section class="panel"><div class="section-head"><h2>① 我的食材</h2><button id="clear" class="text-btn">清空食材</button></div>
    <form id="ingredient-form"><label class="sr-only" for="ingredient-input">输入已有食材</label><div class="search"><input id="ingredient-input" autocomplete="off" placeholder="番茄、鸡蛋，多个食材也可以"><button class="primary" type="submit">添加</button></div></form>
    <p id="input-feedback" class="hint" role="status"></p><div id="selected" class="chips selected"></div>
    <p class="hint">点食材添加，再点已选食材移除。</p><div id="ingredients" class="chips"></div>
    <button id="expand" class="text-btn expand" aria-expanded="false">展开更多食材 ＋</button>
  </section>
  <details class="panel pantry"><summary>② 常备调料 <span id="pantry-count"></span></summary><p class="hint">默认勾选油、盐、生抽、醋和糖；家里没有的请取消。调料也会参与匹配。</p><div id="pantry" class="chips"></div></details>
  <details class="panel pantry filters"><summary>③ 想吃哪一类 <span>可选</span></summary><div class="section-head"><p class="hint">多选时需同时满足。</p><button id="reset-tags" class="text-btn">重置</button></div><div id="tags" class="chips"></div><p class="hint">“素菜”沿用原菜谱分类，可能含蛋奶。</p></details>
  <p id="storage-status" class="storage">食材和调料只保存在这台设备的浏览器中。</p>
</aside>
<section class="results" aria-label="匹配菜谱">
  <div class="result-head"><div><span class="eyebrow">COOK WITH WHAT YOU HAVE</span><h2 id="result-title">先告诉我，你有什么？</h2><p id="result-summary" role="status" aria-live="polite"></p></div><button id="choose" class="primary choose" hidden>帮我挑一道</button></div>
  <div class="tabs" role="group" aria-label="菜谱匹配分类"><button id="tab-ready" class="active" aria-pressed="true">现在就能做 <span id="ready-count">0</span></button><button id="tab-near" aria-pressed="false">补买一点 <span id="near-count">0</span></button></div>
  <p id="group-note" class="group-note"></p><div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden></div>
  <footer>按菜谱所列材料匹配，不判断剩余用量。葱花等可省略材料会单独标注。<br>3道菜配有AI生成的成品示意图，其余菜图待补。</footer>
</section>
</main>
<dialog id="recipe-dialog" aria-labelledby="dish-title"><div id="detail"></div><button id="close-dialog" class="close" aria-label="关闭菜谱">×</button></dialog>
<script src="data.js"></script><script src="core.js"></script><script src="app.js"></script>
</body></html>
